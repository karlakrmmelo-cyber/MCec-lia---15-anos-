<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Maria Cecília - 15 anos</title>

<style>

body{

    margin:0;

    font-family:Arial, sans-serif;

    background:white;

    background-image:url("Identidade Visual - Maria Cecília XV_page-0001.jpg");

    background-repeat:no-repeat;

    background-position:center top;

    background-size:contain;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:flex-end;
}

.container{

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:25px;

    margin-bottom:150px;
}

.botao{

    display:inline-block;

    padding:18px 40px;

    background:#a4161a;

    color:white;

    text-decoration:none;

    border-radius:50px;

    font-weight:bold;

    font-size:18px;

    transition:0.3s;

    box-shadow:0 8px 25px rgba(0,0,0,0.15);

    width:320px;

    text-align:center;
}

.botao:hover{

    transform:scale(1.05);
}

#contador{

    color:#b68b2c;

    font-size:28px;

    font-weight:bold;

    text-align:center;

    text-shadow:0 2px 10px rgba(0,0,0,0.15);
}

</style>
</head>

<body>

<div class="container">

<h2 id="contador"></h2>

<a class="botao"
href="https://docs.google.com/forms/d/e/1FAIpQLSc7xghwOzTBE736l3FPB1BeDEurX69WrWkPDSANGg5NK0ZtVA/viewform?usp=publish-editor"
target="_blank">

Confirme sua presença

</a>

</div>

<script>

const dataFesta = new Date("Sep 12, 2026 16:00:00").getTime();

const contador = setInterval(function() {

    const agora = new Date().getTime();

    const distancia = dataFesta - agora;

    const dias = Math.floor(distancia / (1000 * 60 * 60 * 24));

    const horas = Math.floor((distancia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

    const minutos = Math.floor((distancia % (1000 * 60 * 60)) / (1000 * 60));

    const segundos = Math.floor((distancia % (1000 * 60)) / 1000);

    document.getElementById("contador").innerHTML =
    dias + " dias • "
    + horas + "h • "
    + minutos + "min • "
    + segundos + "s";

}, 1000);

</script>

</body>

</html>
